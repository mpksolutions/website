<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0d0d">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Clockwork - Time Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100vh;
            background: #0b0b0b;
        }

        body {
            background: #0b0b0b;
            color: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: calc(env(safe-area-inset-top) + 1rem) 1rem calc(env(safe-area-inset-bottom) + 1rem);
        }

        .container {
            text-align: center;
            max-width: 520px;
            padding: 2rem 1rem;
        }

        .app-icon {
            width: 128px;
            height: 128px;
            border-radius: 28px;
            margin-bottom: 1.5rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .tagline {
            font-size: 1.125rem;
            color: #a0a0a0;
            margin-bottom: 2.5rem;
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
        }

        .link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .link:hover {
            background: #2a2a2a;
            border-color: #3a3a3a;
            transform: translateY(-1px);
        }

        .link-icon {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .contact-section {
            border-top: 1px solid #2a2a2a;
            padding-top: 2rem;
        }

        .contact-text {
            font-size: 0.875rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
        }

        .email {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffffff;
            text-decoration: none;
            font-weight: 500;
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-size: 0.875rem;
        }

        .email:hover {
            background: #2a2a2a;
            border-color: #3a3a3a;
            transform: translateY(-1px);
        }

        .email-icon {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem 1rem;
            }

            .logo {
                font-size: 2rem;
            }

            .app-icon {
                width: 100px;
                height: 100px;
                border-radius: 22px;
            }

            .tagline {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="/clockwork/app-icon.png" alt="Clockwork App Icon" class="app-icon">

        <div class="logo">Clockwork - Time Tracker</div>

        <div class="links">
            <a href="/clockwork-privacy/" class="link">
                <svg class="link-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
                </svg>
                Privacy Policy
            </a>
        </div>

        <div class="contact-section">
            <div class="contact-text">
                Questions or feedback?
            </div>
            <a href="mailto:hello@mpk.solutions" class="email">
                <svg class="email-icon" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"/>
                    <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"/>
                </svg>
                hello@mpk.solutions
            </a>
        </div>
    </div>
</body>
</html>
